name: Feature request
description: Suggest a safe playback helper feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to add?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Safety boundary
      description: Explain why this does not bypass quizzes, exams, attendance, captchas, or fake progress.
    validations:
      required: true
